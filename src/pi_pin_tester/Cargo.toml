[package]
name = "pi_pin_tester"
version = "0.0.1"
edition = "2021"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
lazy_static = "1.5.0"
rppal = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syact = "0.15.0"
sys-info = "0.9.1"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
